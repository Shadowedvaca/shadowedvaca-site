name: Deploy → Dev

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: shadowedvaca-development-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Resolve immutable deployment commit
        id: release
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          printf '%s\n' "$sha" | grep -Eq '^[0-9a-f]{40}$'
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: pip install -r requirements.txt

      - name: Build static site
        run: python packages/site/build.py

      - name: Package immutable static artifact
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/shadowedvaca-site-static-$DEPLOY_SHA"
          archive="$RUNNER_TEMP/shadowedvaca-site-static-$DEPLOY_SHA.tar.gz"
          install -d "$artifact_root"
          cp -a dist/. "$artifact_root/"
          install -m 0644 login.html register.html "$artifact_root/"
          tar -C "$artifact_root" -czf "$archive" .
          test -s "$archive"
          echo "STATIC_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEV_HOST }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$HOST"
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Stage inactive exact-SHA deployment artifacts
        env:
          HOST: ${{ secrets.DEV_HOST }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$STATIC_ARCHIVE" \
            "root@$HOST:/tmp/shadowedvaca-site-development-$DEPLOY_SHA.tar.gz"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            deploy/shadowedvaca-shared-host-deploy.sh \
            "root@$HOST:/tmp/shadowedvaca-site-development-$DEPLOY_SHA-deploy.sh"

      - name: Activate exact-SHA development deployment
        env:
          HOST: ${{ secrets.DEV_HOST }}
          DEPLOY_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "root@$HOST" \
            "bash '/tmp/shadowedvaca-site-development-$DEPLOY_SHA-deploy.sh' \
              '$DEPLOY_SHA' development \
              '/tmp/shadowedvaca-site-development-$DEPLOY_SHA.tar.gz'"

      - name: Verify public development health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors \
            https://dev.shadowedvaca.com/api/health \
            | python -c 'import json,sys; assert json.load(sys.stdin)=={"ok": True}'

      - name: Remove runner SSH material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
